name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

  # Всё, чему нужен настоящий Postgres: миграции туда и обратно, сверка
  # моделей со схемой и тесты слоя хранения.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siga
          POSTGRES_PASSWORD: siga
          POSTGRES_DB: siga
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siga -d siga"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://siga:siga@localhost:5432/siga
      # Отдельная база: фикстура `session` сносит схему целиком, и делать это
      # в той же базе, где только что проверялись миграции, — плохая идея.
      TEST_DATABASE_URL: postgresql+asyncpg://siga:siga@localhost:5432/siga_test
      PGPASSWORD: siga
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Миграции накатываются и откатываются
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Модели совпадают с миграциями
        run: |
          uv run alembic check

      - name: Тесты, которым нужна база
        run: |
          psql -h localhost -U siga -d siga -c 'CREATE DATABASE siga_test'
          uv run pytest
