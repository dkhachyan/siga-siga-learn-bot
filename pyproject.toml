[project]
name = "siga-siga-learn-bot"
version = "0.1.0"
description = "Telegram-бот для изучения греческих слов через короткие разговоры"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp>=3.10",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siga"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "ASYNC",
    "RUF",
]
ignore = [
    "RUF001",  # кириллица и греческий в строках — это контент, не опечатки
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["siga", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.12"
packages = ["siga"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
