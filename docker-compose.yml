name: siga

x-app: &app
  build: .
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+asyncpg://siga:siga@db:5432/siga
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siga
      POSTGRES_PASSWORD: siga
      POSTGRES_DB: siga
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siga -d siga"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  bot:
    <<: *app
    depends_on: &after-migrate
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Воркеры расписания (§9). Отдельными контейнерами, а не задачами внутри
  # бота: перезапуск бота не должен стирать день, а планировщик, который
  # разговаривает с моделью по минуте, не должен задерживать отправку.
  scheduler:
    <<: *app
    command: ["python", "-m", "siga.workers.scheduler"]
    depends_on: *after-migrate
    restart: unless-stopped

  sender:
    <<: *app
    command: ["python", "-m", "siga.workers.sender"]
    depends_on: *after-migrate
    restart: unless-stopped

volumes:
  pgdata:
